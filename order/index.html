<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>Your Task | HDP Tasks</title><link rel="stylesheet" href="/assets/styles.css"><style>.status-card{padding:18px;border:1px solid #d8dee8;border-radius:14px;background:#fff;margin:18px 0}.report{display:grid;gap:28px}.report section{padding:22px;border:1px solid #e2e8f0;border-radius:16px;background:#fff}.report h2,.report h3{margin-top:0}.report ul{padding-left:22px}.source-list{display:grid;gap:12px}.source-item{padding:12px;border:1px solid #e2e8f0;border-radius:12px}.muted{color:#64748b}.competitor{padding:18px;border:1px solid #e2e8f0;border-radius:14px;margin-top:14px}.grid-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}@media(max-width:760px){.grid-two{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="wrap nav"><a class="brand" href="/"><span class="mark">H</span><span>HDP Tasks</span></a><nav class="navlinks"><a href="/#tasks">Tasks</a></nav></div></header><main><section class="task-hero"><div class="wrap"><span class="pill" id="state-pill">Private order</span><h1 id="headline">Checking your task…</h1><p class="lede" id="message">This private link tracks your paid task from fulfillment through delivery.</p><div class="status-card"><strong id="status-title">Loading status</strong><p id="status-detail" class="muted">Please keep this page open.</p></div></div></section><div class="wrap"><div id="report" class="report" hidden></div></div></main><footer class="footer"><div class="wrap footer-row"><span>© 2026 Highest Degree Priorities · HDP Tasks</span><span>Private order access.</span></div></footer><script>
const API='https://hdppay.highestdegreepriorities.com/tasks-api';
const q=new URLSearchParams(location.search);const sid=q.get('session_id');const hash=new URLSearchParams(location.hash.replace(/^#/,''));const token=hash.get('token');
const pill=document.getElementById('state-pill'),headline=document.getElementById('headline'),message=document.getElementById('message'),statusTitle=document.getElementById('status-title'),statusDetail=document.getElementById('status-detail'),reportEl=document.getElementById('report');
function text(tag,value,cls){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=value??'';return e;}
function list(items){const ul=document.createElement('ul');for(const item of items||[])ul.appendChild(text('li',String(item)));return ul;}
function section(title,body){const s=document.createElement('section');s.appendChild(text('h2',title));if(body instanceof Node)s.appendChild(body);else s.appendChild(text('p',body));return s;}
function fieldBlock(title,items){const d=document.createElement('div');d.appendChild(text('h4',title));d.appendChild(list(items));return d;}
function safeHttpUrl(value){try{const u=new URL(value);return (u.protocol==='https:'||u.protocol==='http:')?u.href:null;}catch{return null;}}
function renderReport(data){const r=data.report||{};reportEl.replaceChildren();const intro=document.createElement('section');intro.appendChild(text('h2','Competitor Research — '+(r.company_or_subject||'')));const meta=document.createElement('div');meta.className='grid-two';meta.appendChild(fieldBlock('Industry',[r.industry||'Not specified']),fieldBlock('Geography',[r.geography||'Not specified']));intro.appendChild(meta,text('h3','Research question'),text('p',r.research_question||''),text('h3','Executive summary'),text('p',r.executive_summary||''));reportEl.appendChild(intro);
const competitors=document.createElement('section');competitors.appendChild(text('h2','Competitors'));for(const c of r.competitors||[]){const card=document.createElement('div');card.className='competitor';card.appendChild(text('h3',c.name||'Competitor'));const cu=safeHttpUrl(c.url);if(cu){const a=document.createElement('a');a.href=cu;a.target='_blank';a.rel='noopener noreferrer';a.textContent=c.url;card.appendChild(a);}card.appendChild(text('h4','Why relevant'),text('p',c.why_relevant||''),text('h4','Positioning'),text('p',c.positioning||''));const g=document.createElement('div');g.className='grid-two';g.appendChild(fieldBlock('Offers',c.offers||[]),fieldBlock('Public pricing observations',c.pricing_observations||[]),fieldBlock('Strengths',c.strengths||[]),fieldBlock('Gaps / limits',c.gaps_or_limits||[]));card.appendChild(g);competitors.appendChild(card);}reportEl.appendChild(competitors,section('Market patterns',list(r.market_patterns||[])),section('Differentiation opportunities',list(r.differentiation_opportunities||[])),section('Risks and uncertainties',list(r.risks_and_uncertainties||[])));
const sources=document.createElement('section');sources.appendChild(text('h2','Sources'));const sourceList=document.createElement('div');sourceList.className='source-list';for(const s of r.sources||[]){const item=document.createElement('div');item.className='source-item';const su=safeHttpUrl(s.url);if(su){const a=document.createElement('a');a.href=su;a.target='_blank';a.rel='noopener noreferrer';a.textContent=s.title||s.url||'Source';item.appendChild(a);}else{item.appendChild(text('strong',s.title||'Source'));}item.appendChild(text('p',s.note||'','muted'));sourceList.appendChild(item);}sources.appendChild(sourceList);reportEl.appendChild(sources);reportEl.hidden=false;}
function setState(state){pill.textContent=(state||'UNKNOWN').replaceAll('_',' ');if(state==='READY_FOR_FULFILLMENT'){headline.textContent='Your task is queued.';statusTitle.textContent='Intake accepted';statusDetail.textContent='The paid order and intake are ready for the fulfillment worker.';}else if(state==='PROCESSING'){headline.textContent='Research is in progress.';statusTitle.textContent='Fulfillment running';statusDetail.textContent='HDP Tasks is performing the research for this order.';}else if(state==='QA_READY'){headline.textContent='Research completed; quality checks are running.';statusTitle.textContent='Quality review';statusDetail.textContent='The research output is being validated and packaged for delivery.';}else if(state==='DELIVERY_READY'){headline.textContent='Your task is complete.';statusTitle.textContent='Result ready';statusDetail.textContent='Your finished research appears below.';}else if(state==='FULFILLMENT_FAILED'||state==='QA_FAILED'){headline.textContent='This task needs attention.';statusTitle.textContent='Processing did not complete normally';statusDetail.textContent='The order remains recorded. HDP Tasks has not marked the work delivered.';}else{headline.textContent='Your task is moving forward.';statusTitle.textContent=state||'Status unavailable';statusDetail.textContent='Refresh this page shortly for an updated status.';}}
async function poll(attempt=0){if(!sid||!token){pill.textContent='Invalid private link';headline.textContent='This result link is incomplete.';statusTitle.textContent='Access unavailable';statusDetail.textContent='Use the private result link provided after submitting your paid task intake.';return;}try{const r=await fetch(API+'/result',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({session_id:sid,token})});if(r.status===403){throw new Error('forbidden');}if(!r.ok)throw new Error('status '+r.status);const data=await r.json();setState(data.state||'UNKNOWN');if(data.state==='DELIVERY_READY'&&data.report){renderReport(data);return;}if(['FULFILLMENT_FAILED','QA_FAILED'].includes(data.state))return;setTimeout(()=>poll(attempt+1),attempt<20?5000:15000);}catch(e){console.error(e);pill.textContent='Access unavailable';headline.textContent='We could not load this task.';statusTitle.textContent='Private result check failed';statusDetail.textContent=e.message==='forbidden'?'This private result link is invalid or expired.':'The status service is temporarily unavailable. Refresh in a moment.';}}
poll();
</script></body></html>
